name: Notify Server

on:
  push:
    branches: [main]

jobs:
  trigger-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server redeploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SERVER_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/winwithpickr/pickr/dispatches \
            -d '{"event_type":"dependency-updated","client_payload":{"repo":"pickr-anthropic"}}'
